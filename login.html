<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Frontón - Login</title>
    <link rel="stylesheet" href="./styles/login.css">
</head>

<body>

    <section class="login">

        <div class="login__banner">

            <div class="overlay"></div>

            <div class="banner__content">
                <div class="logo">
                    🎾
                </div>

                <h1>Club Frontón</h1>

                <p>
                    Sistema de Gestión para la administración de jugadores,
                    partidos y torneos.
                </p>

                
            </div>

        </div>

        <div class="login__container">

            <form class="login__form">

                <div class="form__header">

                    <div class="form__logo">
                        🎾
                    </div>

                    <h2>Club Frontón</h2>

                    <p>Bienvenido de vuelta</p>

                    <span>Inicia sesión para continuar</span>

                </div>

                <div class="form__group">
                    <label for="email">
                        Correo Electrónico
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Ingresa tu correo">
                </div>

                <div class="form__group">
                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Ingresa tu contraseña">
                </div>

                <div class="form__options">

                    <label>
                        <input type="checkbox">
                        Recordarme
                    </label>

                    <a href="#">
                        ¿Olvidaste tu contraseña?
                    </a>

                </div>

                <button type="submit">
                    Iniciar Sesión
                </button>

            </form>

        </div>

    </section>

</body>

</html>
